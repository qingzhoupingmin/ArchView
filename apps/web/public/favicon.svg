<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ArchView">
  <!-- ============ ArchView 品牌图形「AV 一笔连字」（产品文档 §10.2 品牌） ============
       A 的右斜腿与 V 的左斜腿共用同一条斜笔：一条折线 ∧∨ 同时读出 A 与 V，
       折线本身又是屋脊线 / 体量轮廓，与登录页那组纯 CSS 建筑线稿同一语言。
       底为 30×30 圆角方（rx=9 → 改 rx=15 即回到圆形底），填主粉 → 深粉 135° 品牌渐变，
       字为白色圆头描边——favicon 尺寸小，描边取 3.2（组件内同几何用 2.8）。
       ⚠ 本文件是几何的唯一真源：
         · React 侧 packages/ui/src/BrandMark.tsx 引用同一组常量，由 packages/ui/src/brand.test.ts 逐字把关；
         · 位图 favicon-32.png / favicon-180.png / favicon.ico 由 scripts/brand/gen-favicon.mjs 解析本文件生成，
           改完此处请跑 pnpm brand:favicon 重生成。
       色值此处必须写死：favicon 是独立文档，读不到页面 CSS 变量（值与 theme 的
       --color-primary / --color-primary-deep 同值，改动需两边同步）。 -->
  <defs>
    <linearGradient id="av" x1="4" y1="3" x2="28" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EC6D9A" />
      <stop offset="1" stop-color="#C94672" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#av)" />
  <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.1 24L12.7 8L19.3 24L25.9 8" />
    <path d="M9.6 18.6L15.8 18.6" />
  </g>
</svg>
